AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Durable batch workflow and optional AgentCore online evaluation.

Parameters:
  EnvironmentName:
    Type: String
  RuntimeId:
    Type: String
  RuntimeArn:
    Type: String
  KmsKeyArn:
    Type: String
  WorkflowCheckpointsTableName:
    Type: String
  WorkflowEventsTableName:
    Type: String
  RawDataBucketName:
    Type: String
  WorkflowExecutionRoleArn:
    Type: String
  EvaluationExecutionRoleArn:
    Type: String
  EvaluationSamplingPercentage:
    Type: Number
    Default: 10
    MinValue: 0.01
    MaxValue: 100
  EnableOnlineEvaluation:
    Type: String
    Default: DISABLED
    AllowedValues:
      - ENABLED
      - DISABLED

Resources:
  WorkflowLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /aws/ledgerflow/${EnvironmentName}/workflow
      RetentionInDays: 30

  AuditExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ledgerflow-${EnvironmentName}-audit
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DeterministicWorkflowAudit
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:PutItem
                Resource:
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WorkflowCheckpointsTableName}
                  - !Sub arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WorkflowEventsTableName}
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource: !Ref KmsKeyArn
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${RawDataBucketName}/workflow-state/*

  WorkflowAuditFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ledgerflow-${EnvironmentName}-workflow-audit
      Runtime: python3.12
      Handler: lambda.audit_handler.handler
      Role: !GetAtt AuditExecutionRole.Arn
      Timeout: 30
      MemorySize: 512
      CodeUri: ../../
      Environment:
        Variables:
          WORKFLOW_CHECKPOINTS_TABLE: !Ref WorkflowCheckpointsTableName
          WORKFLOW_EVENTS_TABLE: !Ref WorkflowEventsTableName
          ENVIRONMENT_NAME: !Ref EnvironmentName

  InvestigationStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub ledgerflow-${EnvironmentName}-investigations
      RoleArn: !Ref WorkflowExecutionRoleArn
      StateMachineType: STANDARD
      LoggingConfiguration:
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt WorkflowLogGroup.Arn
        IncludeExecutionData: false
        Level: ALL
      DefinitionString: !Sub |
        {
          "Comment": "LedgerFlow durable incident investigation workflow",
          "StartAt": "InvokeAgentRuntime",
          "States": {
            "InvokeAgentRuntime": {
              "Type": "Task",
              "Resource": "arn:${AWS::Partition}:states:::aws-sdk:bedrockagentcore:invokeAgentRuntime",
              "Parameters": {
                "AgentRuntimeArn": "${RuntimeArn}",
                "RuntimeSessionId.$": "States.Format('ledgerflow-runtime-session-{}-invocation', $.workflow_id)",
                "Payload.$": "States.JsonToString($)"
              },
              "Retry": [
                {"ErrorEquals": ["States.Timeout", "States.TaskFailed", "States.ServiceUnavailable"], "IntervalSeconds": 15, "MaxAttempts": 5, "BackoffRate": 2.0}
              ],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "InvestigationFailed"}],
              "ResultPath": "$.agent_result",
              "Next": "AuditInvestigation"
            },
            "AuditInvestigation": {
              "Type": "Task",
              "Resource": "arn:${AWS::Partition}:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${WorkflowAuditFunction.Arn}",
                "Payload": {
                  "workflow_id.$": "$.workflow_id",
                  "tenant_id.$": "$.tenant_id",
                  "customer_id.$": "$.customer_id"
                }
              },
              "Retry": [
                {"ErrorEquals": ["States.Timeout", "States.TaskFailed", "Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException"], "IntervalSeconds": 3, "MaxAttempts": 3, "BackoffRate": 2.0}
              ],
              "Catch": [{"ErrorEquals": ["States.ALL"], "Next": "InvestigationAuditFailed"}],
              "ResultSelector": {"audit.$": "$.Payload"},
              "ResultPath": "$.audit_result",
              "Next": "AuditDecision"
            },
            "AuditDecision": {
              "Type": "Choice",
              "Choices": [
                {"Variable": "$.audit_result.audit.passed", "BooleanEquals": true, "Next": "InvestigationSucceeded"}
              ],
              "Default": "InvestigationCompletedWithFindings"
            },
            "InvestigationSucceeded": {"Type": "Succeed"},
            "InvestigationCompletedWithFindings": {"Type": "Succeed"},
            "InvestigationAuditFailed": {
              "Type": "Fail",
              "Error": "LedgerFlow.InvestigationAuditFailed",
              "Cause": "The post-run deterministic audit could not be completed."
            },
            "InvestigationFailed": {
              "Type": "Fail",
              "Error": "LedgerFlow.InvestigationFailed",
              "Cause": "The Runtime invocation failed after retry and requires checkpoint-based recovery."
            }
          }
        }

  AgentCoreOnlineEvaluation:
    Type: AWS::BedrockAgentCore::OnlineEvaluationConfig
    Properties:
      OnlineEvaluationConfigName: !Sub LedgerFlow_${EnvironmentName}_Evaluation
      Description: Sample live traces for correctness, helpfulness, and goal success.
      EvaluationExecutionRoleArn: !Ref EvaluationExecutionRoleArn
      ExecutionStatus: !Ref EnableOnlineEvaluation
      DataSourceConfig:
        CloudWatchLogs:
          LogGroupNames:
            - !Sub /aws/bedrock-agentcore/runtimes/${RuntimeId}-DEFAULT
          ServiceNames:
            - bedrock-agentcore
      Evaluators:
        - EvaluatorId: Builtin.Correctness
        - EvaluatorId: Builtin.Helpfulness
        - EvaluatorId: Builtin.GoalSuccessRate
      Rule:
        SamplingConfig:
          SamplingPercentage: !Ref EvaluationSamplingPercentage
        SessionConfig:
          SessionTimeoutMinutes: 30
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Purpose
          Value: quality

Outputs:
  StateMachineArn:
    Value: !GetAtt InvestigationStateMachine.Arn
  StateMachineName:
    Value: !Ref InvestigationStateMachine
  AuditFunctionArn:
    Value: !GetAtt WorkflowAuditFunction.Arn
  EvaluationConfigArn:
    Value: !GetAtt AgentCoreOnlineEvaluation.OnlineEvaluationConfigArn
  WorkflowLogGroupName:
    Value: !Ref WorkflowLogGroup
